services:
  nuvio-reco:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 7000
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:7000:7000"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs: ["/tmp"]
    security_opt:
      - no-new-privileges:true
